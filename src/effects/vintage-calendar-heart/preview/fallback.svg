<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 368 490" width="368" height="490">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a0913" />
      <stop offset="50%" stop-color="#140308" />
      <stop offset="100%" stop-color="#060103" />
    </radialGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9e1c2f" />
      <stop offset="50%" stop-color="#8a1727" />
      <stop offset="100%" stop-color="#660e1b" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef9" />
      <stop offset="50%" stop-color="#fbf7ee" />
      <stop offset="100%" stop-color="#f5efdf" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="368" height="490" fill="url(#bgGrad)" />

  <!-- Hanging Cords -->
  <line x1="184" y1="58" x2="96" y2="94" stroke="#d1a74d" stroke-width="1.8" />
  <line x1="184" y1="58" x2="272" y2="94" stroke="#d1a74d" stroke-width="1.8" />
  <circle cx="184" cy="58" r="6" fill="#f3d37a" stroke="#745413" stroke-width="1" />

  <!-- Backing Board -->
  <rect x="68" y="94" width="232" height="348" rx="16" fill="url(#boardGrad)" filter="url(#shadow)" stroke="rgba(255,160,180,0.2)" stroke-width="1.2" />

  <!-- Header Script -->
  <text x="184" y="125" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-weight="700" font-size="22" fill="#fff0c7">Lịch 2026</text>

  <!-- Clamping Bar -->
  <rect x="76" y="144" width="216" height="18" rx="4" fill="#320811" />

  <!-- Paper Pad -->
  <rect x="81" y="158" width="206" height="270" fill="url(#paperGrad)" stroke="#e6ddcc" stroke-width="1" />

  <!-- Pad Header -->
  <text x="93" y="178" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10.5" fill="#b51f2d" letter-spacing="0.8">THÁNG MƯỜI MỘT</text>
  <text x="275" y="178" text-anchor="end" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11.5" fill="#b51f2d">2026</text>
  <line x1="93" y1="183" x2="275" y2="183" stroke="#b51f2d" stroke-width="1.4" />

  <!-- Date 19 -->
  <text x="184" y="250" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="90" fill="#be1c2d">19</text>
  <text x="184" y="306" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12.5" fill="#be1c2d" letter-spacing="3">THỨ NĂM</text>

  <!-- Divider -->
  <line x1="95" y1="324" x2="273" y2="324" stroke="#ded5c2" stroke-width="1" />

  <!-- Bottom Info -->
  <text x="125" y="338" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="8.5" fill="#6b7280">Tháng Mười</text>
  <text x="125" y="360" text-anchor="middle" font-family="'Playfair Display', serif" font-weight="700" font-size="22" fill="#22385a">11</text>
  <text x="125" y="376" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="8.5" fill="#6b7280">Bính Ngọ</text>
  <line x1="159" y1="330" x2="159" y2="380" stroke="#ded5c2" stroke-width="1" />
  <text x="219" y="352" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-weight="700" font-size="13.5" fill="#b51f2d" font-style="italic">Ngày Quốc tế</text>
  <text x="219" y="368" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-weight="700" font-size="13.5" fill="#b51f2d" font-style="italic">Nam giới</text>
  <text x="184" y="398" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="8" fill="#8c7d6b">Ngày Đinh Dậu</text>

  <!-- Animated Heart Outline Path -->
  <path d="M 184 212 C 158 200, 126 202, 100 220 C 96 250, 102 284, 122 312 C 152 334, 184 348, 190 353 C 196 356, 180 355, 162 344 C 194 326, 224 300, 244 272 C 248 242, 244 216, 220 202 C 200 200, 184 212, 184 212 Z"
        fill="none" stroke="#ff3b68" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Final Message -->
  <text x="184" y="468" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-weight="700" font-size="28" fill="#fff0f5">Ngày của anh ♥</text>
</svg>
