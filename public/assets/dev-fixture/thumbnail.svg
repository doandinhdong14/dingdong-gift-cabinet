<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FBF9F5"/>
  <g transform="translate(200, 150)">
    <!-- Isometric cube representation -->
    <!-- Top Face -->
    <polygon points="0,-70 70,-30 0,10 -70,-30" fill="#A78BFA"/>
    <!-- Left Face -->
    <polygon points="-70,-30 0,10 0,90 -70,50" fill="#8B5CF6"/>
    <!-- Right Face -->
    <polygon points="0,10 70,-30 70,50 0,90" fill="#7C3AED"/>
    <!-- Technical indicator pill -->
    <ellipse cx="35" cy="50" rx="14" ry="7" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">
    Khối kiểm tra kỹ thuật (Dev Fixture)
  </text>
</svg>
