<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark deep space background gradient -->
    <radialGradient id="c11-bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#180B22"/>
      <stop offset="50%" stop-color="#0E0516"/>
      <stop offset="100%" stop-color="#050109"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="center-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA80B0" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FF3366" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#c11-bg-grad)"/>

  <!-- Center luminous ambient bloom -->
  <circle cx="200" cy="145" r="95" fill="url(#center-flare)"/>

  <!-- Subtle 3D Depth Heart Ribbon Path (Back orbit) -->
  <path d="M 200,85 C 225,35 295,45 295,110 C 295,160 200,225 200,225 C 200,225 105,160 105,110 C 105,45 175,35 200,85 Z"
        fill="none" stroke="#6D28D9" stroke-width="8" opacity="0.25" stroke-dasharray="6,8"/>

  <!-- Glowing Heart Ribbon Path (Front orbit) -->
  <path d="M 200,85 C 225,35 295,45 295,110 C 295,160 200,225 200,225 C 200,225 105,160 105,110 C 105,45 175,35 200,85 Z"
        fill="none" stroke="#EA80B0" stroke-width="3" opacity="0.55" filter="url(#neon-glow)"/>

  <!-- Streaming Kinetic Text Ribbons along Heart Curve -->
  <g filter="url(#neon-glow)">
    <!-- Top Right Lobe -->
    <text x="260" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#EA80B0" transform="rotate(18 260 70)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>
    <text x="295" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" transform="rotate(55 295 115)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>
    <text x="270" y="165" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EA80B0" transform="rotate(78 270 165)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>

    <!-- Bottom Tip -->
    <text x="200" y="222" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">I LOVE YOU</text>

    <!-- Bottom Left to Lobe -->
    <text x="130" y="165" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EA80B0" transform="rotate(-78 130 165)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>
    <text x="105" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" transform="rotate(-55 105 115)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>
    <text x="140" y="70" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#EA80B0" transform="rotate(-18 140 70)" text-anchor="middle" letter-spacing="1.5">I LOVE YOU</text>

    <!-- Center Cleft -->
    <text x="200" y="88" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFB4D6" text-anchor="middle" letter-spacing="1">I LOVE YOU</text>
  </g>

  <!-- Sparkling Neon Star Flares -->
  <circle cx="200" cy="85" r="3" fill="#FFFFFF" filter="url(#neon-glow)"/>
  <circle cx="295" cy="110" r="2.5" fill="#FFFFFF" filter="url(#neon-glow)"/>
  <circle cx="105" cy="110" r="2.5" fill="#FFFFFF" filter="url(#neon-glow)"/>
  <circle cx="200" cy="225" r="3" fill="#FFFFFF" filter="url(#neon-glow)"/>

  <!-- Badge / Card Label -->
  <rect x="14" y="14" width="76" height="22" rx="11" fill="rgba(234, 128, 176, 0.2)" stroke="rgba(234, 128, 176, 0.5)" stroke-width="1"/>
  <text x="52" y="29" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#EA80B0" text-anchor="middle" letter-spacing="0.5">CARD 11</text>

  <!-- 3D Spatial Indicator Icon -->
  <g transform="translate(345, 18) scale(0.75)" opacity="0.85">
    <circle cx="16" cy="16" r="15" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(234, 128, 176, 0.4)" stroke-width="1.5"/>
    <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#EA80B0" stroke-width="1.5" transform="rotate(-25 16 16)"/>
    <ellipse cx="16" cy="16" rx="11" ry="5" fill="none" stroke="#EA80B0" stroke-width="1.5" transform="rotate(35 16 16)"/>
  </g>
</svg>