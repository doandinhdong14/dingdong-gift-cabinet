<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="fbSpaceGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0b173c"/>
      <stop offset="60%" stop-color="#050a1b"/>
      <stop offset="100%" stop-color="#02040e"/>
    </radialGradient>
    <filter id="fbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Night Space -->
  <rect width="400" height="300" fill="url(#fbSpaceGrad)"/>

  <!-- Twinkling Stars -->
  <g opacity="0.8">
    <circle cx="50" cy="40" r="1.5" fill="#FFEAA7"/>
    <circle cx="120" cy="60" r="2" fill="#FFFFFF"/>
    <circle cx="280" cy="50" r="2.5" fill="#FFF8E7"/>
    <circle cx="350" cy="80" r="1.5" fill="#FFEAA7"/>
    <circle cx="80" cy="240" r="1.8" fill="#FFFFFF"/>
    <circle cx="320" cy="230" r="2" fill="#FFF9E6"/>
  </g>

  <!-- Center Fallback Badge -->
  <g transform="translate(200, 130)">
    <!-- Planet / Nebula Ring -->
    <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#FFF7D6" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="#FF3B69" opacity="0.85" filter="url(#fbGlow)"/>
    <path d="M 0,-18 C 10,-38 32,-26 20,-4 C 8,16 0,28 0,28 C 0,28 -8,16 -20,-4 C -32,-26 -10,-38 0,-18 Z" fill="#FFFFFF"/>
  </g>

  <!-- 2D Fallback Notification Label -->
  <rect x="70" y="210" width="260" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(255,247,214,0.3)" stroke-width="1"/>
  <text x="200" y="234" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#FFF7D6">
    Vũ trụ lời chúc (Chế độ 2D Fallback)
  </text>
</svg>
