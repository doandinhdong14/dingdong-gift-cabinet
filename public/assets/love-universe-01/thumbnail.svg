<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a173d"/>
      <stop offset="60%" stop-color="#04091a"/>
      <stop offset="100%" stop-color="#02040d"/>
    </radialGradient>

    <!-- Warm Golden Text Glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <linearGradient id="photoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FD746C"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>

    <linearGradient id="photoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1c71"/>
      <stop offset="100%" stop-color="#d76d77"/>
    </linearGradient>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="400" height="300" fill="url(#spaceGrad)"/>

  <!-- Starry Field -->
  <g opacity="0.85">
    <circle cx="45" cy="35" r="1.5" fill="#FFEAA7"/>
    <circle cx="85" cy="90" r="1.2" fill="#FFFFFF"/>
    <circle cx="120" cy="40" r="2.5" fill="#FFF8E7" filter="url(#starGlow)"/>
    <circle cx="120" cy="40" r="1.5" fill="#FFF"/>
    <circle cx="160" cy="110" r="1" fill="#FFF"/>
    <circle cx="210" cy="30" r="2" fill="#FFE8A3"/>
    <circle cx="270" cy="75" r="3" fill="#FFF9E6" filter="url(#starGlow)"/>
    <circle cx="270" cy="75" r="1.8" fill="#FFF"/>
    <circle cx="340" cy="45" r="1.5" fill="#FFFFFF"/>
    <circle cx="370" cy="95" r="2" fill="#FFEAA7"/>
    <circle cx="30" cy="180" r="1" fill="#FFF"/>
    <circle cx="70" cy="240" r="2" fill="#FFF"/>
    <circle cx="140" cy="260" r="1.5" fill="#FFE8A3"/>
    <circle cx="240" cy="270" r="2" fill="#FFF"/>
    <circle cx="310" cy="230" r="2.5" fill="#FFF9E6" filter="url(#starGlow)"/>
    <circle cx="310" cy="230" r="1.5" fill="#FFF"/>
    <circle cx="365" cy="210" r="1.2" fill="#FFEAA7"/>
    <circle cx="195" cy="195" r="1" fill="#FFF"/>
  </g>

  <!-- 3D Perspective Photo Card 1 (Tilted Left) -->
  <g transform="translate(105, 120) rotate(-8) scale(0.72)">
    <rect x="-45" y="-55" width="90" height="110" rx="4" fill="#FDFBF7" stroke="#ECE4D8" stroke-width="2"/>
    <rect x="-38" y="-48" width="76" height="74" rx="2" fill="url(#photoGrad1)"/>
    <circle cx="0" cy="-12" r="18" fill="#FFEAA7" opacity="0.6"/>
    <path d="M -38,26 L -15,-5 L 10,12 L 38,-15 L 38,26 Z" fill="#1E272E" opacity="0.85"/>
    <circle cx="28" cy="40" r="4" fill="#FF4757"/>
  </g>

  <!-- 3D Perspective Photo Card 2 (Tilted Right) -->
  <g transform="translate(295, 135) rotate(10) scale(0.68)">
    <rect x="-45" y="-55" width="90" height="110" rx="4" fill="#FDFBF7" stroke="#ECE4D8" stroke-width="2"/>
    <rect x="-38" y="-48" width="76" height="74" rx="2" fill="url(#photoGrad2)"/>
    <path d="M 0,-18 C 8,-35 25,-25 15,-5 C 5,12 0,22 0,22 C 0,22 -5,12 -15,-5 C -25,-25 -8,-35 0,-18 Z" fill="#FF7675" opacity="0.85"/>
  </g>

  <!-- Floating Glowing Vietnamese Wishes -->
  <!-- Upper Far Left Wish -->
  <g transform="translate(130, 75) rotate(-3)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="15" fill="#FFF7D6">Iu em nhất trên đời</text>
  </g>

  <!-- Upper Center Right Wish -->
  <g transform="translate(270, 70) rotate(5)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFF2B2">iu ní nhiều lắm</text>
  </g>

  <!-- Main Hero Center Wish -->
  <g transform="translate(195, 135) rotate(-2)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="21" fill="#FFFFFF">Chào cậu mình iu cậu nhiều lắm</text>
  </g>

  <!-- Mid Below Center Wish -->
  <g transform="translate(185, 175) rotate(3)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#FFF7D6">Iu 1000 lần</text>
  </g>

  <!-- Date / Memory Wish -->
  <g transform="translate(90, 205) rotate(-6)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="15" fill="#FFE8A3">17/11/200X</text>
  </g>

  <!-- Bottom Right Wish -->
  <g transform="translate(285, 215) rotate(4)" filter="url(#textGlow)">
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#FFF7D6">Mỗi ngày đều yêu cậu</text>
  </g>

  <!-- Floating 3D Hearts -->
  <!-- Heart 1 Left -->
  <path d="M 60,110 C 66,96 82,102 74,116 C 66,130 60,138 60,138 C 60,138 54,130 46,116 C 38,102 54,96 60,110 Z"
        fill="#FF3B69" opacity="0.9" filter="url(#textGlow)"/>

  <!-- Heart 2 Center -->
  <path d="M 215,95 C 220,83 234,88 227,99 C 220,110 215,117 215,117 C 215,117 210,110 203,99 C 196,88 210,83 215,95 Z"
        fill="#FF5277" opacity="0.95" filter="url(#textGlow)"/>

  <!-- Heart 3 Lower Right -->
  <path d="M 245,185 C 251,172 266,177 259,190 C 252,202 245,210 245,210 C 245,210 238,202 231,190 C 224,177 239,172 245,185 Z"
        fill="#E84393" opacity="0.92" filter="url(#textGlow)"/>

  <!-- Heart 4 Bottom Center -->
  <path d="M 175,230 C 180,219 193,223 187,233 C 181,243 175,250 175,250 C 175,250 169,243 163,233 C 157,223 170,219 175,230 Z"
        fill="#FF3B69" opacity="0.88"/>
</svg>
