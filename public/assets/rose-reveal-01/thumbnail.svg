<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D1527" />
      <stop offset="60%" stop-color="#190B17" />
      <stop offset="100%" stop-color="#0E050D" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B6948" />
      <stop offset="40%" stop-color="#5E966C" />
      <stop offset="100%" stop-color="#2D5237" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DA87C" />
      <stop offset="60%" stop-color="#4A7E56" />
      <stop offset="100%" stop-color="#2D5237" />
    </linearGradient>
    <radialGradient id="roseCore" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="35%" stop-color="#F48FB1" />
      <stop offset="70%" stop-color="#D81B60" />
      <stop offset="100%" stop-color="#880E4F" />
    </radialGradient>
    <radialGradient id="petalGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="40%" stop-color="#F8BBD0" />
      <stop offset="80%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#AD1457" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient sparkles -->
  <circle cx="120" cy="110" r="1.5" fill="#FFE4E8" opacity="0.6" />
  <circle cx="280" cy="95" r="2" fill="#FFE4E8" opacity="0.8" />
  <circle cx="90" cy="220" r="1.5" fill="#FFE4E8" opacity="0.5" />
  <circle cx="310" cy="250" r="2.5" fill="#FFE4E8" opacity="0.7" />
  <circle cx="200" cy="70" r="1" fill="#FFE4E8" opacity="0.6" />
  <circle cx="150" cy="310" r="1.5" fill="#FFE4E8" opacity="0.4" />

  <!-- Stem -->
  <path d="M 200 190 Q 203 260 198 320 T 201 370" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Leaves -->
  <!-- Upper Leaf Right -->
  <path d="M 202 240 Q 235 230 250 215 Q 235 255 201 248 Z" fill="url(#leafGrad)" />
  <path d="M 202 240 Q 228 234 250 215" fill="none" stroke="#8BC34A" stroke-width="1" opacity="0.6" />

  <!-- Middle Leaf Left -->
  <path d="M 199 285 Q 165 280 148 298 Q 168 310 198 292 Z" fill="url(#leafGrad)" />
  <path d="M 199 285 Q 170 292 148 298" fill="none" stroke="#8BC34A" stroke-width="1" opacity="0.6" />

  <!-- Sepals -->
  <path d="M 192 192 Q 170 205 165 225 Q 180 210 196 195 Z" fill="#4A7E56" />
  <path d="M 208 192 Q 230 205 235 225 Q 220 210 204 195 Z" fill="#4A7E56" />
  <path d="M 200 195 Q 200 220 198 232 Q 202 218 202 195 Z" fill="#5E966C" />
  <ellipse cx="200" cy="192" rx="14" ry="7" fill="#3B6948" />

  <!-- Outer Layer Petals -->
  <path d="M 155 155 C 145 110 185 100 200 120 C 215 100 255 110 245 155 C 235 185 215 195 200 195 C 185 195 165 185 155 155 Z" fill="url(#petalGlow)" />
  
  <path d="M 140 140 C 135 170 170 195 200 195 C 175 190 150 170 140 140 Z" fill="#C2185B" opacity="0.5" />
  <path d="M 260 140 C 265 170 230 195 200 195 C 225 190 250 170 260 140 Z" fill="#C2185B" opacity="0.5" />

  <!-- Mid Layer Petals -->
  <path d="M 160 140 C 155 105 190 95 200 115 C 210 95 245 105 240 140 C 230 175 170 175 160 140 Z" fill="url(#roseCore)" />

  <!-- Inner Swirl Petals -->
  <path d="M 175 130 C 170 110 195 105 200 120 C 205 105 230 110 225 130 C 220 155 180 155 175 130 Z" fill="#F48FB1" />
  <path d="M 185 125 C 185 112 200 110 205 118 C 210 112 215 118 212 128 C 208 140 188 138 185 125 Z" fill="#FFF0F3" />
  <path d="M 193 120 C 195 115 205 115 205 122 C 203 126 195 126 193 120 Z" fill="#D81B60" />

  <!-- Soft rim highlight on top petals -->
  <path d="M 158 135 Q 178 95 200 115 Q 222 95 242 135" fill="none" stroke="#FFE4E8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Floating preview petal -->
  <g transform="translate(265, 110) rotate(25) scale(0.65)">
    <path d="M 0 0 C -15 -25 15 -35 25 -10 C 35 15 10 30 0 0 Z" fill="url(#petalGlow)" opacity="0.85" filter="url(#glow)" />
  </g>
</svg>
